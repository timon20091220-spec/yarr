    <style>

      #unity-canvas{display:block;width:100%!important;height:100%!important;transform:none!important;touch-action:none;-webkit-user-select:none;user-select:none}
      body.spacewar-open #unity-container{opacity:1;visibility:visible;pointer-events:auto}
      #space-arcade-launcher{position:fixed;inset:0;z-index:999999;display:flex;align-items:center;justify-content:center;padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));box-sizing:border-box;background:radial-gradient(circle at 50% 20%,#102955 0,#071127 34%,#020612 72%);transition:opacity .22s ease}
      body.spacewar-open #space-arcade-launcher{opacity:0;pointer-events:none}
      .arcade-shell{width:min(920px,100%);text-align:center}
      .arcade-kicker{font-size:12px;letter-spacing:4px;color:#67d8ff;margin-bottom:9px}.arcade-title{font-size:clamp(34px,8vw,68px);font-weight:900;letter-spacing:2px;margin:0}.arcade-sub{font-size:15px;color:#8faaca;margin:10px 0 28px}
      .game-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
      .game-card{position:relative;min-height:220px;border:1px solid rgba(92,211,255,.34);border-radius:24px;padding:24px;text-align:left;color:#eef8ff;background:linear-gradient(145deg,rgba(20,65,118,.54),rgba(6,17,43,.88));box-shadow:0 18px 60px rgba(0,0,0,.28),inset 0 0 34px rgba(58,181,255,.05);cursor:pointer;overflow:hidden;-webkit-tap-highlight-color:transparent}
      .game-card:active{transform:scale(.985)}.game-card[disabled]{cursor:default;opacity:.46}.game-card[disabled]:active{transform:none}
      .game-no{font-size:12px;letter-spacing:3px;color:#63d8ff}.game-name{font-size:32px;font-weight:900;margin-top:18px}.game-desc{font-size:14px;color:#a6b9d2;margin-top:9px;line-height:1.55}.game-action{position:absolute;left:24px;bottom:22px;font-size:13px;font-weight:800;letter-spacing:2px;color:#78e6ff}.kingdom{border-color:rgba(199,169,93,.28);background:linear-gradient(145deg,rgba(81,62,24,.42),rgba(17,15,13,.86))}.kingdom .game-no,.kingdom .game-action{color:#dac17e}
      #arcade-ready{height:18px;margin-top:18px;font-size:12px;color:#7791ad}
      @media(max-width:620px){.arcade-shell{max-width:430px}.game-grid{grid-template-columns:1fr;gap:12px}.game-card{min-height:156px;padding:20px}.game-name{font-size:27px;margin-top:11px}.game-desc{max-width:280px}.game-action{left:20px;bottom:18px}.arcade-sub{margin-bottom:18px}}

  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">SPACE_WAR_1.0_UNITY_FIX32_2</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/GitHubPages_20260817_135658.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/GitHubPages_20260817_135658.data.unityweb",
        frameworkUrl: buildUrl + "/GitHubPages_20260817_135658.framework.js.unityweb",
        codeUrl: buildUrl + "/GitHubPages_20260817_135658.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "SPACE_WAR_1.0_UNITY_FIX32_2",
        productVersion: "1.0",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
              }).then((unityInstance) => {
        window.__spaceWarUnityInstance = unityInstance;
        if (window.__spaceArcadeUnityReady) window.__spaceArcadeUnityReady();
                document.querySelector("#unity-loading-bar").style.display = "none";
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  
  <div id="space-arcade-launcher">
    <main class="arcade-shell">
      <div class="arcade-kicker">SELECT YOUR WORLD</div>
      <h1 class="arcade-title">SPACE ARCADE</h1>
      <div class="arcade-sub">플레이할 게임을 선택하세요.</div>
      <div class="game-grid">
        <button id="open-space-war" class="game-card" type="button" disabled>
          <div class="game-no">GAME 01</div><div class="game-name">SPACE WAR</div>
          <div class="game-desc">우주 생존 전투 · 계정 로그인 후 시작</div><div id="space-war-action" class="game-action">LOADING...</div>
        </button>
        <button class="game-card kingdom" type="button" disabled>
          <div class="game-no">GAME 02</div><div class="game-name">미정</div>
          <div class="game-desc">두 번째 게임은 아직 정해지지 않았습니다.</div><div class="game-action">미정</div>
        </button>
      </div>
      <div id="arcade-ready">SPACE WAR를 준비하는 중...</div>
    </main>
  </div>
  <script>
    window.__spaceArcadeUnityReady=function(){
      var b=document.getElementById('open-space-war'),a=document.getElementById('space-war-action'),s=document.getElementById('arcade-ready');
      if(b)b.disabled=false;if(a)a.textContent='PLAY';if(s)s.textContent='준비 완료';
    };
    window.__spaceArcadeSafeFullscreen=function(){
      try{
        if(document.fullscreenElement||document.webkitFullscreenElement)return;
        var el=document.documentElement;
        var fn=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen||el.msRequestFullscreen;
        if(!fn)return;
        var result=fn.call(el);
        if(result&&typeof result.catch==='function')result.catch(function(){});
      }catch(e){}
    };
    window.__spaceArcadeOpenSpaceWar=function(){
      var u=window.__spaceWarUnityInstance;if(!u)return;
      document.body.classList.add('spacewar-open');
      // V7: do not call Unity SetFullscreen here. On some Android Chrome builds
      // its failed permission promise bubbles into Unity as a fatal popup. Use
      // the browser API with an explicit rejection handler so SPACE WAR still opens.
      window.__spaceArcadeSafeFullscreen();
      try{u.SendMessage('SpaceWarGame','OpenFromArcadeLauncher');}catch(e){}
      try{window.dispatchEvent(new Event('resize'));}catch(e){}
    };
    document.addEventListener('DOMContentLoaded',function(){
      var b=document.getElementById('open-space-war');
      if(b)b.addEventListener('pointerdown',function(e){e.preventDefault();window.__spaceArcadeOpenSpaceWar();},{passive:false});
      if(window.__spaceWarUnityInstance)window.__spaceArcadeUnityReady();
    });
  </script>
